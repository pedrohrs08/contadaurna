# Guarda em fakes.json uma cópia dos pareceres publicados no banco. Ela serve de reserva para o site
# (se o serviço da Cloudflare não responder) e de histórico público no GitHub.
name: Cópia dos pareceres

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: copia-pareceres
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar os pareceres publicados
        run: |
          api=$(grep -oE '^const FAKES_API = "[^"]*"' index.html | cut -d'"' -f2)
          if [ -z "$api" ]; then echo "FAKES_API ainda vazio no index.html"; exit 0; fi
          curl -fsS --max-time 60 "$api/pareceres" -o novo.json
          python3 -c '
          import json, sys
          d = json.load(open("novo.json", encoding="utf-8"))
          assert isinstance(d, list) and d and all(isinstance(f, dict) and f.get("id") for f in d), "resposta inesperada"
          open("fakes.json", "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=1) + "\n")
          '
          rm novo.json
      - name: Guardar se mudou e republicar o site
        run: |
          git diff --quiet fakes.json && { echo "Sem mudança."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fakes.json
          git commit -q -m "Cópia dos pareceres publicados"
          git pull --rebase -q origin main && git push -q origin HEAD:main
          gh workflow run pages.yml --ref main
          gh workflow run arquivar.yml --ref main

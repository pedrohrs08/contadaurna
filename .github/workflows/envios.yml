# Roda os testes do servidor de envios (envios/) a cada PR ou push que mexe nele.
name: Testes do servidor de envios

on:
  pull_request:
    paths: ["envios/**", ".github/workflows/envios.yml"]
  push:
    branches: [main]
    paths: ["envios/**", ".github/workflows/envios.yml"]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r envios/requirements.txt pytest==9.2.0
      - run: pytest -q envios
